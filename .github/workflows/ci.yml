name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  agent:
    name: agent (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync deps
        run: uv sync --extra dev
      # Ruff is scoped to hirewire/ + tests/ because legacy agent/main.py has
      # 69 pre-existing ruff issues that Phase 2 resolves when the file is split.
      - name: Lint (hirewire only — legacy main.py rewrite is Phase 2)
        run: uv run ruff check agent/hirewire/ agent/tests/
      - name: Test
        run: uv run pytest -q

  web:
    name: web (typescript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # web/.npmrc sets legacy-peer-deps=true so npm ci works without flags
      # (react-router-hono-server peer-dep on @types/react@^19 vs our React 18.3).
      - name: Install
        run: npm ci
      # Soft-fail: 21 pre-existing TS7016 errors come from React Router typegen
      # complaining about .jsx route files. Phase 4 converts routes to .tsx and
      # this becomes a hard check.
      - name: Typecheck (soft — 21 baseline errors from .jsx routes; Phase 4 fixes)
        run: npm run typecheck
        continue-on-error: true
      - name: Test
        run: npm run test:run
