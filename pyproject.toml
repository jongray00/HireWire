[project]
name = "sally-sales-agent"
version = "0.1.0"
description = "SignalWire AI voice agent backend serving dynamic SWML for virtual employees"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.1",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.1.1",
    "sendgrid>=6.10.0",
    "signalwire-agents>=1.1.0",
    "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
